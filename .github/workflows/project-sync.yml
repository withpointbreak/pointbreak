name: Project sync

# Labels are the single writable source of planning state: priority:*, effort:*,
# status:*, research, tracking. This workflow is a convenience mirror, not an
# enforcement point: it copies the labels one way into the fields of the org
# project board (https://github.com/orgs/withpointbreak/projects/2) that its
# views sort and group on, and it tidies label events as they arrive. The label
# set on the issue stays authoritative; a missed or failed run leaves the board
# stale until the next run, never the labels wrong. Theme is board-only and
# hand-set; the sync never touches it.
#
# On a label event the guard re-reads the issue's current labels and label
# history before acting, so a stale event (the set already moved on) does
# nothing. It reverts planning labels changed by people without write access,
# and keeps the priority:*/effort:* label added last when a namespace gains a
# second one, for bot events too. Removing the only priority:* or effort:*
# label is reported on the issue. Reconciliation never resolves conflicting
# labels by picking one: it clears that field, keeps the item out of Ready, and
# warns. The decisions live in scripts/project-sync-labels.sh and are tested by
# scripts/project-sync-labels-selftest.sh (just workflow-lint).
#
# An issue event syncs that one issue. The daily run and workflow_dispatch
# reconcile every open issue, so a missed webhook or a renamed label heals
# within a day. Project mutations need a fine-grained token with the
# organization permission "Projects: read and write" (plus repository
# "Issues: read" on this repository), stored as the repository secret
# PROJECT_SYNC_TOKEN. The label guard uses the workflow's own token.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: "41 6 * * *" # daily 06:41 UTC, ahead of nightly.yml's 07:00
  workflow_dispatch:
    inputs:
      issue:
        description: "Sync one issue number (default: every open issue)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: project-sync-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: withpointbreak
  PROJECT_NUMBER: "2"

jobs:
  sync:
    name: sync
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: fetch the decision script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One file at the triggering commit; no checkout action needed.
          gh api "repos/${REPO}/contents/scripts/project-sync-labels.sh?ref=${SHA}" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/project-sync-labels.sh"
          chmod +x "$RUNNER_TEMP/project-sync-labels.sh"

      - name: guard planning labels
        if: github.event_name == 'issues' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
          EVENT_AT: ${{ github.event.issue.updated_at }}
        run: |
          set -euo pipefail
          case "$LABEL" in
            priority:*|effort:*|status:*|research|tracking) ;;
            *) echo "not a planning label: $LABEL"; exit 0 ;;
          esac
          # Repository role of the person who changed the label. Triage-level
          # collaborators can label but may not set planning state; outsiders
          # cannot label at all, so this mostly guards templates and future
          # collaborators. Bots have no collaborator role and skip the role
          # check, not the namespace rules.
          role="bot"
          if [ "$ACTOR_TYPE" != "Bot" ]; then
            role="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.role_name // .permission' 2>/dev/null || echo none)"
          fi
          # Re-read the current labels and the label history: the event may be
          # stale by the time this run starts.
          labels="$(gh api --paginate "repos/${REPO}/issues/${ISSUE}/labels?per_page=100" --jq '[.[].name]' | jq -cs 'add // []')"
          history="$(gh api --paginate "repos/${REPO}/issues/${ISSUE}/events?per_page=100" \
            --jq '[.[] | select(.event == "labeled" or .event == "unlabeled")
                   | {event, label: .label.name, actor: .actor.login, at: .created_at, id}]' \
            | jq -cs 'add // []')"
          decision="$(jq -cn --arg action "$ACTION" --arg label "$LABEL" --arg actor "$ACTOR" --arg at "$EVENT_AT" \
              --arg type "$ACTOR_TYPE" --arg role "$role" --argjson labels "$labels" --argjson history "$history" \
              '{action: $action, label: $label, actor: $actor, at: $at, actorType: $type, role: $role, labels: $labels, history: $history}' \
            | "$RUNNER_TEMP/project-sync-labels.sh" guard)"
          echo "decision: $decision"
          jq -r '.notes[]' <<<"$decision"
          encoded="$(jq -rn --arg s "$LABEL" '$s | @uri')"
          case "$(jq -r '.revert // ""' <<<"$decision")" in
            remove) gh api -X DELETE "repos/${REPO}/issues/${ISSUE}/labels/${encoded}" --silent ;;
            restore) gh api -X POST "repos/${REPO}/issues/${ISSUE}/labels" -f "labels[]=${LABEL}" --silent ;;
          esac
          jq -r '.remove[]' <<<"$decision" | while IFS= read -r other; do
            [ -n "$other" ] || continue
            other_encoded="$(jq -rn --arg s "$other" '$s | @uri')"
            gh api -X DELETE "repos/${REPO}/issues/${ISSUE}/labels/${other_encoded}" --silent
            echo "removed ${other}: superseded by ${LABEL}"
          done
          body="$(jq -r '.comment // ""' <<<"$decision")"
          if [ -n "$body" ]; then
            gh api -X POST "repos/${REPO}/issues/${ISSUE}/comments" -f body="$body" --silent
          fi

      - name: sync board fields from labels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROJECT_SYNC_TOKEN is not set; see the header comment of this workflow"
            exit 1
          fi

          # 1. The board, its single-select fields, and their options, looked
          #    up by name so no id is hard-coded.
          # shellcheck disable=SC2016
          project="$(gh api graphql -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -f query='
            query($owner: String!, $number: Int!) {
              organization(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }')"
          project_id="$(jq -r '.data.organization.projectV2.id' <<<"$project")"
          field_id() {
            jq -r --arg n "$1" '.data.organization.projectV2.fields.nodes[] | select(.name == $n) | .id' <<<"$project"
          }
          option_id() {
            jq -r --arg f "$1" --arg o "$2" '.data.organization.projectV2.fields.nodes[] | select(.name == $f) | .options[] | select(.name == $o) | .id' <<<"$project"
          }
          for f in Priority Effort Workflow; do
            if [ -z "$(field_id "$f")" ]; then
              echo "::error::project field '$f' not found on project ${PROJECT_OWNER}/${PROJECT_NUMBER}"
              exit 1
            fi
          done

          # 2. Which issues: the event's issue, the dispatch input, or every
          #    open issue (pull requests excluded).
          if [ -n "$EVENT_ISSUE" ]; then
            numbers="$EVENT_ISSUE"
          elif [ -n "$INPUT_ISSUE" ]; then
            numbers="$INPUT_ISSUE"
          else
            numbers="$(GH_TOKEN="$REPO_TOKEN" gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | .number')"
          fi

          set_field() { # set_field <item id> <field name> <option name or empty to clear>
            local item="$1" field="$2" option="$3" fid oid
            fid="$(field_id "$field")"
            if [ -z "$option" ]; then
              # shellcheck disable=SC2016
              gh api graphql -f p="$project_id" -f i="$item" -f f="$fid" --silent -f query='
                mutation($p: ID!, $i: ID!, $f: ID!) {
                  clearProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f }) { projectV2Item { id } }
                }'
              return
            fi
            oid="$(option_id "$field" "$option")"
            if [ -z "$oid" ]; then
              echo "::error::option '${option}' is missing on field '${field}'; add it on the board or fix the mapping"
              exit 1
            fi
            # shellcheck disable=SC2016
            gh api graphql -f p="$project_id" -f i="$item" -f f="$fid" -f o="$oid" --silent -f query='
              mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: { projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o } }) { projectV2Item { id } }
              }'
          }

          # 3. Label -> field mapping, one issue at a time.
          for n in $numbers; do
            issue="$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${REPO}/issues/${n}")"
            node_id="$(jq -r '.node_id' <<<"$issue")"
            # Board values from the current labels. Conflicting or missing
            # priority:/effort: labels clear that field and are reported here,
            # never resolved by picking one.
            fields="$(jq -c '[.labels[].name]' <<<"$issue" | "$RUNNER_TEMP/project-sync-labels.sh" fields)"
            priority="$(jq -r '.priority' <<<"$fields")"
            effort="$(jq -r '.effort' <<<"$fields")"
            workflow="$(jq -r '.workflow' <<<"$fields")"
            jq -r --arg n "$n" '.problems[] | "::warning::#\($n): \(.)"' <<<"$fields"

            # addProjectV2ItemById is idempotent: it returns the existing item
            # when the issue is already on the board.
            # shellcheck disable=SC2016
            item="$(gh api graphql -f p="$project_id" -f c="$node_id" --jq '.data.addProjectV2ItemById.item.id' -f query='
              mutation($p: ID!, $c: ID!) {
                addProjectV2ItemById(input: { projectId: $p, contentId: $c }) { item { id } }
              }')"

            set_field "$item" Priority "$priority"
            set_field "$item" Effort "$effort"
            set_field "$item" Workflow "$workflow"
            echo "#${n}: Priority=${priority:-<cleared>} Effort=${effort:-<cleared>} Workflow=${workflow:-<cleared>}"
          done
