name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-full:
    name: test-full (ubuntu-latest)
    # The full suite with the qualification evidence harness compiled in: the
    # feature-gated tests that run in no per-push lane run here on a schedule.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-test-full
      - run: just test-full
      - name: upload test timings
        # Runs on failure too: the runs that most need timing evidence are the
        # ones that did not pass.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-nightly-test-full
          path: target/nextest/default/junit.xml
          if-no-files-found: error

  git-parity:
    name: git parity (${{ matrix.os }})
    timeout-minutes: 15
    # The differential subprocess-vs-gix parity harness, exercised on both
    # platforms where the object-format and path-separator behavior differs.
    # Report-only in this phase: divergences in unqualified classes are expected
    # and do not fail the lane; the diagnostic probes assert their own expected
    # divergence. Builds --features gix-parity, so it deliberately does not
    # share the test-full cache key.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
      - run: just git-parity
