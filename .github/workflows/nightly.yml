name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  # Opt-in pre-merge escape hatch: pushing a branch whose name contains
  # full-ci (for example feat/event-walk-full-ci) runs the whole scheduled
  # suite on that branch before the PR lands. Costs nothing on any other
  # branch.
  push:
    branches:
      - "**full-ci**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-full:
    name: test-full (ubuntu-latest)
    # The full suite with the qualification evidence harness compiled in: the
    # feature-gated tests that run in no per-push lane run here on a schedule.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.86.5
        with:
          tool: just
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.86.5
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-test-full
      - run: just test-full
      - name: upload test timings
        # Runs on failure too: the runs that most need timing evidence are the
        # ones that did not pass.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-nightly-test-full
          path: target/nextest/default/junit.xml
          if-no-files-found: error
      - name: check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo-deny-advisories:
    name: cargo deny (advisories)
    # Advisory failures are time-triggered — a new RUSTSEC entry can redden
    # CI with no code change — so they run here on a cadence rather than on
    # the per-push path. The deterministic license/ban/source checks run
    # per-push in ci.yml behind the dependency surface.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - name: check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  git-parity:
    name: git parity (${{ matrix.os }})
    timeout-minutes: 15
    # The differential subprocess-vs-gix parity harness, exercised on both
    # platforms where the object-format and path-separator behavior differs.
    # Report-only in this phase: divergences in unqualified classes are expected
    # and do not fail the lane; the diagnostic probes assert their own expected
    # divergence. Builds --features gix-parity, so it deliberately does not
    # share the test-full cache key.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.86.5
        with:
          tool: just
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.86.5
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just git-parity
      - name: check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
