name: CI (Nix)

# Experimental, parallel Nix-driven variant of ci.yml. It does NOT replace ci.yml;
# the two run side by side while we evaluate whether a hermetic, store-cached gate
# is worth adopting. Linux and macOS only: Nix has no native Windows support, so the
# Windows legs stay in ci.yml. See the PR discussion for the Windows cross-compile
# sketch (nextest archive built on Linux, executed on a plain Windows runner).
#
# The flake already carries the full gate:
#   - `nix flake check`  -> the same fmt + clippy + test gate ci.yml runs, through the
#                           flake's pinned Fenix toolchain instead of rustup:
#                           checks.cli-nextest (full Git-less nextest suite),
#                           checks.clippy (`-D warnings`) and checks.fmt (nightly
#                           rustfmt) — clippy and the tests share crane's dependency
#                           artifacts — plus checks.devshell-tools (tool-version drift).
#                           cli-nextest compiles the whole crate and all test targets, so
#                           it covers the same cfg/feature arms ci.yml's macOS
#                           `check-types` leg does.
#   - `nix build .#build-all`    -> the store-backed counterpart of `just build-all`
#                           (CLI + embedded Inspector bundle + platform VSIX), with no
#                           checkout mutation and no npm network access. Because the
#                           Inspector bundle is rebuilt here, this sidesteps ci.yml's
#                           `assets/app.js` staleness gate entirely.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nix:
    name: nix gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Persist /nix/store across runs through GitHub's own Actions cache — no
      # external account (Cachix / FlakeHub) required. Without this, every run
      # recompiles crane's dependency artifacts from source. Keyed on the inputs
      # that actually invalidate the store; the prefix restore warms partial hits.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'src/cli/inspect/web/package-lock.json', 'extensions/vscode/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # `nix flake check` builds every check in one arbitrary-order batch, so it
      # cannot express "cheap gate first". Realising the checks individually does:
      # each step below is an explicit dependency of the next, and a failure stops
      # the job before the expensive phases run.
      #
      # Logs are compact by default; the failure step at the end dumps the full
      # build log of whatever failed, which is the idiomatic Nix pattern (`-L` on
      # every step is what made these runs unreadable).

      # Phase 1 — formatting. Compiles nothing, so this is a true early return.
      - name: fmt
        run: nix build .#cli-fmt

      # Phase 2 — clippy. Linux only, mirroring ci.yml: the lint result is
      # platform-independent, and `--all-targets` compiles the whole test surface,
      # so running it on both platforms bought a second full compile for nothing.
      - name: clippy
        if: runner.os == 'Linux'
        run: nix build .#cli-clippy

      # Phase 3 — the full Git-less nextest suite, plus the pinned-tool drift check.
      - name: test
        run: nix build .#cli-nextest .#devshell-tools

      # Phase 4 — hermetic artifact build (CLI + embedded Inspector + VSIX).
      - name: build
        run: nix build .#build-all

      # Nix prints only a summary on failure; surface the actual build log.
      - name: dump failing build log
        if: failure()
        run: nix log "$(nix eval --raw .#cli-nextest.drvPath)" 2>/dev/null | tail -150 || true
