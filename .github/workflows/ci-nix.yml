name: Flake health

# Guards the flake itself, which CONTRIBUTING.md names as the recommended way to set
# up the project (`nix develop`) and which now also supplies ci.yml's toolchain on
# Linux and macOS. If the flake breaks, the documented first-choice setup breaks with
# it, so something has to exercise it.
#
# It deliberately does NOT re-run clippy or the test suite. ci.yml already runs those,
# on the same code, through this same flake toolchain — paying for them twice bought a
# roughly 1.5x slower duplicate gate. What is unique to Nix is whether the flake still
# evaluates, whether the dev shell still carries the pinned tools, and whether a fully
# hermetic build of the shippable artifact still succeeds with no network.
#
# `nix build .#build-all` covers most of that transitively: it needs the crane
# dependency artifacts (so every dependency must still compile in the sandbox), the
# CLI, an offline npm build of the Inspector bundle, and the VSIX packaging step.
#
# The sandbox-only regressions this does not catch — a test that needs a tool absent
# from the nextest derivation's nativeBuildInputs — are covered by the nightly full
# `nix flake check` below rather than on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the full hermetic check that is too slow to gate pull requests.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-health:
    name: flake health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # The dev shell still resolves and its pinned tools are the expected versions.
      - name: dev shell tools
        run: nix build .#devshell-tools

      # A hermetic, network-free build of everything the project ships.
      - name: hermetic artifact build
        run: nix build .#build-all

      - name: dump failing build log
        if: failure()
        run: nix log "$(nix eval --raw .#build-all.drvPath)" 2>/dev/null | tail -100 || true

  full-check:
    name: full flake check (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # Builds every check, including the whole suite inside the sandbox. This is the
      # only thing that catches a test needing a tool the derivation does not provide.
      - name: nix flake check
        run: nix flake check

      - name: dump failing build log
        if: failure()
        run: nix log "$(nix eval --raw .#cli-nextest.drvPath)" 2>/dev/null | tail -150 || true
