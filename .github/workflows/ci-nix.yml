name: CI (Nix)

# The hermetic counterpart to ci.yml. Both lanes now compile with the same flake-pinned
# toolchain, so this is not here to re-check the lints or the assertions — ci.yml covers
# those, and a broken flake already fails it because it runs `nix develop .#ci`.
#
# What only this lane can establish is that the suite passes in a SANDBOX: no host
# tools leaking in, no network, and no reuse of a `target/` directory restored from a
# cache. ci.yml's speed comes precisely from that restored target/, which makes a
# stale-artifact false green possible there and impossible here.
#
# Linux gates every pull request. macOS runs the same thing nightly rather than per
# pull request: it measured 22m37s against Linux's 15m46s, which is not worth adding
# to every change for a platform ci.yml already tests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the platforms not gated per pull request.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nix-gate:
    name: nix gate (ubuntu-latest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main

      # Stores individual store paths over the GitHub Actions cache and skips anything
      # fetchable from cache.nixos.org. Its predecessor tarred the whole /nix/store
      # (4.87GB on Linux, 4.46GB on macOS), which alone exceeded the 10GB repository
      # limit, so the two platforms evicted each other and every run started cold.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # `nix flake check` builds every check in one arbitrary-order batch, so it cannot
      # express "cheap gate first". Realising them individually can: each step is a
      # dependency of the next, and a failure stops the job before the expensive phases.

      # Phase 1 — formatting. Compiles nothing, so this is a true early return.
      - name: fmt
        run: nix build .#cli-fmt

      # Phase 2 — clippy, with the shared test-profile dependency artifacts.
      - name: clippy
        run: nix build .#cli-clippy

      # Phase 3 — the full suite in the sandbox, plus pinned-tool drift.
      - name: test
        run: nix build .#cli-nextest .#devshell-tools

      # Phase 4 — hermetic, network-free build of everything the project ships.
      - name: build
        run: nix build .#build-all

      - name: dump failing build log
        if: failure()
        run: nix log "$(nix eval --raw .#cli-nextest.drvPath)" 2>/dev/null | tail -150 || true

  full-check:
    name: full flake check (${{ matrix.os }})
    # Nightly and on demand only. Runs `nix flake check` rather than the named phases
    # above so that a check added to the flake cannot be silently left ungated.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: nix flake check
        run: nix flake check
      - name: dump failing build log
        if: failure()
        run: nix log "$(nix eval --raw .#cli-nextest.drvPath)" 2>/dev/null | tail -150 || true
