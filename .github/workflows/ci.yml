name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  guard:
    name: guard
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      qualification: ${{ steps.paths.outputs.qualification }}
      installer: ${{ steps.paths.outputs.installer }}
      skills: ${{ steps.paths.outputs.skills }}
      web: ${{ steps.paths.outputs.web }}
      extension: ${{ steps.paths.outputs.extension }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The surface resolution diffs against the event's base commit, which
          # a depth-one clone does not have.
          fetch-depth: 0
      - id: paths
        name: resolve which filtered surfaces the change set touches
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # Fail OPEN: when the diff cannot be computed — an empty or all-zero
          # base, an unreachable commit after a force-push — every filtered
          # job runs. A path filter that fails closed silently stops
          # qualifying the product.
          qualification=true installer=true skills=true web=true extension=true
          if [ -n "$BASE" ] \
             && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && files=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            qualification=false installer=false skills=false web=false extension=false
            while IFS= read -r file; do
              case "$file" in
                # A change to how the jobs run must re-run every filtered job.
                .github/workflows/ci.yml)
                  qualification=true installer=true skills=true web=true extension=true
                  ;;
                src/session/derived_access/*|src/bench_support/*|src/bench_support.rs|benches/store_foundation.rs)
                  qualification=true
                  ;;
                scripts/install*|.github/binary-targets.json)
                  installer=true
                  ;;
                skills/*|Justfile)
                  skills=true
                  ;;
                src/cli/inspect/web/*|src/cli/inspect/assets/app.js)
                  web=true
                  ;;
                extensions/vscode/*)
                  extension=true
                  ;;
              esac
            done <<< "$files"
          fi
          {
            echo "qualification=$qualification"
            echo "installer=$installer"
            echo "skills=$skills"
            echo "web=$web"
            echo "extension=$extension"
          } >> "$GITHUB_OUTPUT"
      # Only push events can ever suppress anything: on every other event the
      # resolve step is skipped, its output is empty, and downstream
      # conditions treat an empty output as "run".
      - id: resolve
        if: github.event_name == 'push'
        name: resolve whether this SHA already passed as a pull_request run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # Fail OPEN: skip starts false and only a positive already-green
          # match flips it. An API error, an empty result, or any
          # non-success conclusion runs the full matrix — a guard that fails
          # closed silently stops testing main.
          skip=false
          if conclusions=$(gh api -X GET \
               "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
               -f head_sha="$SHA" -f event=pull_request -f status=completed \
               --jq '[.workflow_runs[].conclusion]' 2>/dev/null); then
            if [ "$conclusions" != "[]" ] \
               && ! printf '%s' "$conclusions" | grep -qv '"success"'; then
              echo "SHA ${SHA} already passed as a pull_request run; skipping the push matrix."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  installer-selftest:
    name: installer self-test (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.skip != 'true' && needs.guard.outputs.installer == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - run: just installer-selftest

  validate-skills:
    name: validate skills
    needs: guard
    if: needs.guard.outputs.skip != 'true' && needs.guard.outputs.skills == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          ignore-nothing-to-cache: true
      - uses: taiki-e/install-action@just
      - name: Validate Agent Skills
        run: just skills-validate

  lint-workflows:
    name: lint workflows
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: reviewdog/action-actionlint@5eaffa19a1991ecc52b11eddcdd57760d1ac7e3d # v1.72.0
        with:
          fail_level: error
          filter_mode: nofilter
      - run: just workflow-lint-assertions

  web-check:
    name: web check (inspector front-end)
    needs: guard
    if: needs.guard.outputs.skip != 'true' && needs.guard.outputs.web == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/cli/inspect/web/.nvmrc
          cache: npm
          cache-dependency-path: src/cli/inspect/web/package-lock.json
      - name: npm ci
        working-directory: src/cli/inspect/web
        run: npm ci
      - name: biome lint + tsc --noEmit
        working-directory: src/cli/inspect/web
        run: npm run check
      - name: app.js freshness (rebuild + diff)
        working-directory: src/cli/inspect/web
        run: |
          npm run build
          git diff --exit-code ../assets/app.js \
            || { echo "::error::assets/app.js is stale — run 'just web-build' and commit the result."; exit 1; }

  extension-check:
    name: extension check
    needs: guard
    if: needs.guard.outputs.skip != 'true' && needs.guard.outputs.extension == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: extensions/vscode/.nvmrc
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: npm ci
        working-directory: extensions/vscode
        run: npm ci
      - name: biome + tsc + vitest
        working-directory: extensions/vscode
        run: npm run check

  test:
    name: ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    # Roughly double the slowest observed leg, so a cache-cold run passes while
    # a hang fails within the hour instead of the six-hour default.
    timeout-minutes: 30
    # Windows is the CI long pole and is spawn-bound (per-CreateProcess cost), so its
    # ~226s execution is fanned across parallel slice-partitioned shards while ubuntu and
    # macOS stay single legs. Lint runs on Linux only; the cfg(windows)/cfg(not(unix))
    # arms are type-checked once on a dedicated Windows check leg; the shard legs run
    # tests only. All Windows legs share one rust-cache entry (shared-key) since they
    # compile the identical test-binary set.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: "test (ubuntu-latest)",
              os: ubuntu-latest,
              gate: lint,
              run_tests: true,
            }
          - {
              name: "test (macos-latest)",
              os: macos-latest,
              gate: check,
              run_tests: true,
            }
          - {
              name: "test (windows-latest check)",
              os: windows-latest,
              gate: check,
              run_tests: false,
            }
          - {
              name: "test (windows-latest 1/3)",
              os: windows-latest,
              run_tests: true,
              shard: 1,
              shards: 3,
            }
          - {
              name: "test (windows-latest 2/3)",
              os: windows-latest,
              run_tests: true,
              shard: 2,
              shards: 3,
            }
          - {
              name: "test (windows-latest 3/3)",
              os: windows-latest,
              run_tests: true,
              shard: 3,
              shards: 3,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'windows-shards' || '' }}
      - name: just lint
        if: matrix.gate == 'lint'
        run: just lint
      - name: just check-types
        if: matrix.gate == 'check'
        run: just check-types
      - name: configure Windows test debuginfo
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_PROFILE_TEST_SPLIT_DEBUGINFO=packed" >> "$GITHUB_ENV"
      - name: just test-ci
        if: matrix.run_tests
        run: just test-ci ${{ matrix.shard && format('--partition slice:{0}/{1}', matrix.shard, matrix.shards) || '' }}
      - name: upload test timings
        # Runs on failure too: the runs that most need timing evidence are the
        # ones that did not pass.
        if: ${{ !cancelled() && matrix.run_tests }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.os }}${{ matrix.shard && format('-{0}-of-{1}', matrix.shard, matrix.shards) || '' }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  store-foundation-qualification:
    name: store foundation qualification (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.skip != 'true' && needs.guard.outputs.qualification == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
        with:
          tool: nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: store-foundation-qualification
      - name: run derived-access feature tests
        run: just derived-access-tests
      - name: run deterministic qualification matrix
        shell: bash
        run: |
          report="$(mktemp)"
          set +e
          just store-foundation-qualification-smoke >"$report"
          status=$?
          set -e
          jq -c '{
            sourceCommit: .plan.sourceCommit,
            environment: .evidence.results[0].environment,
            completeness,
            failures: [
              .evidence.results[]
              | select(.outcome != "passed")
              | {entryId, execution, outcome, failure}
            ]
          }' "$report"
          exit "$status"
