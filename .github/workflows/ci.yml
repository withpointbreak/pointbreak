name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  installer-selftest:
    name: installer self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - run: just installer-selftest

  validate-skills:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          ignore-nothing-to-cache: true
      - uses: taiki-e/install-action@just
      - name: Validate Agent Skills
        run: just skills-validate

  lint-workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: reviewdog/action-actionlint@5eaffa19a1991ecc52b11eddcdd57760d1ac7e3d # v1.72.0
        with:
          fail_level: error
          filter_mode: nofilter
      - run: just workflow-lint-assertions

  web-check:
    name: web check (inspector front-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/cli/inspect/web/.nvmrc
          cache: npm
          cache-dependency-path: src/cli/inspect/web/package-lock.json
      - name: npm ci
        working-directory: src/cli/inspect/web
        run: npm ci
      - name: biome lint + tsc --noEmit
        working-directory: src/cli/inspect/web
        run: npm run check
      - name: app.js freshness (rebuild + diff)
        working-directory: src/cli/inspect/web
        run: |
          npm run build
          git diff --exit-code ../assets/app.js \
            || { echo "::error::assets/app.js is stale — run 'just web-build' and commit the result."; exit 1; }

  extension-check:
    name: extension check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: extensions/vscode/.nvmrc
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: npm ci
        working-directory: extensions/vscode
        run: npm ci
      - name: biome + tsc + vitest
        working-directory: extensions/vscode
        run: npm run check

  test:
    name: ${{ matrix.name }}
    # Windows is the CI long pole and is spawn-bound (per-CreateProcess cost), so its
    # ~226s execution is fanned across parallel slice-partitioned shards while ubuntu and
    # macOS stay single legs. Lint runs on Linux only; the cfg(windows)/cfg(not(unix))
    # arms are type-checked once on a dedicated Windows check leg; the shard legs run
    # tests only. All Windows legs share one rust-cache entry (shared-key) since they
    # compile the identical test-binary set.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: "test (ubuntu-latest)",
              os: ubuntu-latest,
              gate: lint,
              run_tests: true,
              nix: true,
            }
          - {
              name: "test (macos-latest)",
              os: macos-latest,
              gate: check,
              run_tests: true,
              nix: true,
            }
          - {
              name: "test (windows-latest check)",
              os: windows-latest,
              gate: check,
              run_tests: false,
            }
          - {
              name: "test (windows-latest 1/3)",
              os: windows-latest,
              run_tests: true,
              shard: 1,
              shards: 3,
            }
          - {
              name: "test (windows-latest 2/3)",
              os: windows-latest,
              run_tests: true,
              shard: 2,
              shards: 3,
            }
          - {
              name: "test (windows-latest 3/3)",
              os: windows-latest,
              run_tests: true,
              shard: 3,
              shards: 3,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Linux and macOS take their toolchain from the flake, so CI compiles with the
      # exact rustc, nightly rustfmt, and nextest that `nix develop` gives a
      # contributor — pinned by flake.lock rather than resolved by rustup at run time.
      # `.#ci` is a lean shell: no cocogitto (built from source), gh, or cargo-edit.
      #
      # Windows keeps rustup because Nix has no native Windows support. Removing that
      # last rustup dependency needs the cross-compiled nextest archive from
      # ci-nix-windows-spike.yml to graduate out of its report-only phase.
      # See docs/ci-architecture.md#toolchain-comes-from-the-flake.
      - uses: DeterminateSystems/nix-installer-action@main
        if: matrix.nix
      - uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527 # v2
        if: matrix.nix
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.nix }}
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ !matrix.nix }}
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
        if: ${{ !matrix.nix }}
      - uses: taiki-e/install-action@nextest
        if: ${{ !matrix.nix }}

      # Belongs here and NOT on the Nix lane: rust-cache caches ~/.cargo and ./target,
      # and `nix build` runs in a sandbox that never writes the workspace target/, so
      # there it would cache an empty directory. Here cargo runs in the workspace, so
      # target/ persists and stays incremental.
      # See docs/ci-architecture.md#rejected-alternatives.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'windows-shards' || '' }}

      - name: just lint
        if: matrix.gate == 'lint'
        run: ${{ matrix.nix && 'nix develop .#ci -c' || '' }} just lint
      - name: just check-types
        if: matrix.gate == 'check'
        run: ${{ matrix.nix && 'nix develop .#ci -c' || '' }} just check-types
      - name: configure Windows test debuginfo
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_PROFILE_TEST_SPLIT_DEBUGINFO=packed" >> "$GITHUB_ENV"
      - name: just test-ci
        if: matrix.run_tests
        run: ${{ matrix.nix && 'nix develop .#ci -c' || '' }} just test-ci ${{ matrix.shard && format('--partition slice:{0}/{1}', matrix.shard, matrix.shards) || '' }}

  store-foundation-qualification:
    name: store foundation qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: store-foundation-qualification
      - name: run deterministic qualification matrix
        shell: bash
        run: |
          report="$(mktemp)"
          set +e
          just store-foundation-qualification-smoke >"$report"
          status=$?
          set -e
          jq -c '{
            sourceCommit: .plan.sourceCommit,
            environment: .evidence.results[0].environment,
            completeness,
            failures: [
              .evidence.results[]
              | select(.outcome != "passed")
              | {entryId, execution, outcome, failure}
            ]
          }' "$report"
          exit "$status"

  git-parity:
    name: git parity (${{ matrix.os }})
    # The differential subprocess-vs-gix parity harness, exercised on both
    # platforms where the object-format and path-separator behavior differs.
    # Report-only in this phase: divergences in unqualified classes are expected
    # and do not fail the lane; the diagnostic probes assert their own expected
    # divergence.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: just git-parity
