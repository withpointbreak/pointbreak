name: windows ci measure

# Dispatch-only measurement harness for the Windows test leg.
# This workflow NEVER runs on push or pull_request — it only exists so the wall-time
# levers can be measured on the real runner image and reverted. Each instrument is
# behind its own boolean input and is meant to be dispatched ONE AT A TIME: the
# Defender step changes the runner's security posture for the rest of the job, so
# enabling it alongside another instrument would skew that instrument's wall.
on:
  workflow_dispatch:
    inputs:
      sys_user:
        description: "Run the sys:user split (bash time)"
        type: boolean
        default: true
      git_latency:
        description: "Run the git per-spawn latency loop (native CreateProcess)"
        type: boolean
        default: false
      defender_toggle:
        description: "Re-enable Defender for one run to measure headroom (reverts)"
        type: boolean
        default: false
      shard_probe:
        description: "Run the 3-shard rust-cache-warmth probe"
        type: boolean
        default: false
      quiet_log:
        description: "Compare chatty vs quiet test-ci log output on one runner"
        type: boolean
        default: false
      volume_probe:
        description: "Report TEMP location, disk backing and C:/D: flush latency (no build; runs alone)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  measure:
    timeout-minutes: 90
    name: measure (windows-latest)
    # The volume probe needs no toolchain or build, so skip this job's setup when it runs.
    if: ${{ !inputs.volume_probe }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: just
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # --- sys:user split -------------------------------------------------------
      # The suite is parallel (CPU >> wall), so a high sys:user ratio is the
      # spawn-bound signal. `time` writes real/user/sys (including children) to
      # stderr; read those off the run log. This run's `real` is also the
      # pre-change Windows wall baseline.
      - name: (measure) sys:user split
        if: ${{ inputs.sys_user }}
        shell: bash
        run: |
          time just test-ci

      # --- Defender headroom ----------------------------------------------------
      # Restore the unmitigated posture (real-time monitoring on, drive exclusions
      # removed) to MEASURE how much Defender costs on this suite. The runner VM is
      # ephemeral, so nothing persists past this job; this never adds an exclusion.
      - name: (measure) re-enable Defender (reverts at job end)
        if: ${{ inputs.defender_toggle }}
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          Remove-MpPreference -ExclusionPath "C:\" -ErrorAction SilentlyContinue
          Remove-MpPreference -ExclusionPath "D:\" -ErrorAction SilentlyContinue
      - name: (measure) suite with Defender on
        if: ${{ inputs.defender_toggle }}
        shell: bash
        run: |
          time just test-ci

      # --- git per-spawn latency ------------------------------------------------
      # The git spawn COUNT is OS-independent (taken from the local measurement), so
      # only the Windows per-spawn LATENCY is measured here. A PATH shim cannot count
      # native spawns on Windows anyway — Rust's Command::new("git") resolves git.exe
      # via CreateProcess, which appends only `.exe` and never finds a `.cmd`/extension-
      # less shim — so this times git the way the product spawns it: a native
      # CreateProcess of git.exe in a tight loop. Multiply this against the local count
      # to size the git-spawn share of wall (the deferred gix question).
      - name: (measure) git per-spawn latency
        if: ${{ inputs.git_latency }}
        shell: pwsh
        run: |
          $git = (Get-Command git).Source
          $n = 200
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt $n; $i++) { & $git rev-parse HEAD | Out-Null }
          $sw.Stop()
          $total = $sw.Elapsed.TotalMilliseconds
          "$n x git rev-parse HEAD: $([math]::Round($total)) ms total (per-spawn ~ $([math]::Round($total / $n, 2)) ms)"

      # --- log-output cost ------------------------------------------------------
      # Does the chatty CI log (status-level=pass + final-status-level=all + forced
      # color → ~3500 ANSI lines on Windows) add wall? Run the suite twice on the SAME
      # runner to control for the large run-to-run variance: first chatty (the ci
      # profile as shipped), then quiet (only failures, no color). The second run reuses
      # the first's compiled binaries, so compare the two nextest run-phase `Summary
      # [Ns]` lines (both warm, compile excluded) — the delta is the log-output cost.
      - name: (measure) log-output cost (chatty vs quiet, same runner)
        if: ${{ inputs.quiet_log }}
        shell: bash
        run: |
          echo "=== chatty: ci profile as shipped (status-level=pass, final=all, color always) ==="
          time just test-ci
          echo "=== quiet: only failures, no color ==="
          time env CARGO_TERM_COLOR=never just test-ci --status-level fail --final-status-level fail

  probe:
    timeout-minutes: 90
    name: shard probe ${{ matrix.shard }}/3
    if: ${{ inputs.shard_probe }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: just
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # A/B: shared-key now ACTIVE. All 3 shards restore ONE cache entry (they compile
        # the identical test-binary set), instead of N distinct per-leg caches that fight
        # the 10GB cap. Dispatch twice: the first run seeds the shared entry (cold), the
        # second restores it (warm). Compare cache hit/miss + compile time against the
        # earlier default-per-leg probe run (which was cold per-shard).
        with:
          shared-key: windows-shards
      - name: compile-only timing
        shell: bash
        run: time cargo nextest run --profile ci --no-run
      - name: partitioned run timing
        shell: bash
        run: time just test-ci --partition slice:${{ matrix.shard }}/3

  # --- temp volume probe (#822) ----------------------------------------------
  # Windows CI shards sometimes stop completing tests for 30-150 s while four
  # flush-heavy derived-access tests are in flight. One hypothesis is a slow or
  # throttled OS disk under the default TEMP. This reports where TEMP points,
  # what backs each volume, and small-write flush latency on the TEMP volume,
  # RUNNER_TEMP and the workspace, sequentially and with four writers at once.
  volume_probe:
    timeout-minutes: 15
    name: volume probe (windows-latest)
    if: ${{ inputs.volume_probe }}
    runs-on: windows-latest
    steps:
      - name: (measure) temp location, disk backing and flush latency
        shell: pwsh
        run: |
          "TEMP=$env:TEMP"
          "TMP=$env:TMP"
          "GetTempPath=$([IO.Path]::GetTempPath())"
          "RUNNER_TEMP=$env:RUNNER_TEMP"
          "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          "ImageVersion=$env:ImageVersion"
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemLabel, FileSystem, DriveType, SizeRemaining, Size -AutoSize | Out-String -Width 200
          Get-Partition | Where-Object DriveLetter | Format-Table DriveLetter, DiskNumber, Size -AutoSize | Out-String -Width 200
          Get-PhysicalDisk | Format-Table DeviceId, FriendlyName, MediaType, BusType, Size -AutoSize | Out-String -Width 200
          # Pointbreak's derived-access authority needs an active NTFS USN journal on the
          # volume that holds the store. Report both volumes, then create one on D: with
          # C:'s parameters and confirm it is active.
          "--- fsutil usn queryjournal C: ---"; fsutil usn queryjournal C:
          "--- fsutil usn queryjournal D: (before) ---"; fsutil usn queryjournal D:
          $c = fsutil usn queryjournal C: | Out-String
          $max = [regex]::Match($c, 'Maximum Size\s*:\s*(0x[0-9a-fA-F]+)').Groups[1].Value
          $delta = [regex]::Match($c, 'Allocation Delta\s*:\s*(0x[0-9a-fA-F]+)').Groups[1].Value
          "createjournal m=$max a=$delta D:"; fsutil usn createjournal "m=$max" "a=$delta" D:
          "--- fsutil usn queryjournal D: (after) ---"; fsutil usn queryjournal D:
          $flush = {
            param($dir, $n)
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $buf = New-Object byte[] 4096
            $lat = New-Object System.Collections.Generic.List[double]
            for ($i = 0; $i -lt $n; $i++) {
              $path = Join-Path $dir "probe-$([guid]::NewGuid()).bin"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $fs = [IO.File]::Open($path, 'Create', 'Write', 'None')
              $fs.Write($buf, 0, $buf.Length)
              $fs.Flush($true)
              $fs.Dispose()
              Remove-Item -LiteralPath $path
              $sw.Stop()
              $lat.Add($sw.Elapsed.TotalMilliseconds)
            }
            $lat
          }
          function Summarize($label, $values) {
            $s = @($values | Sort-Object)
            $n = $s.Count
            "{0}: n={1} p50={2:N2}ms p90={3:N2}ms p99={4:N2}ms max={5:N2}ms" -f $label, $n, $s[[int]($n * 0.5)], $s[[int]($n * 0.9)], $s[[math]::Max(0, [int]($n * 0.99) - 1)], $s[-1]
          }
          $dirs = [ordered]@{
            temp      = Join-Path ([IO.Path]::GetTempPath()) 'pb-822-probe'
            runner    = Join-Path $env:RUNNER_TEMP 'pb-822-probe'
            workspace = Join-Path $env:GITHUB_WORKSPACE 'pb-822-probe'
          }
          foreach ($name in $dirs.Keys) {
            Summarize "$name sequential ($($dirs[$name]))" (& $flush $dirs[$name] 500)
          }
          $flushText = $flush.ToString()
          foreach ($name in $dirs.Keys) {
            $dir = $dirs[$name]
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $all = 1..4 | ForEach-Object -ThrottleLimit 4 -Parallel {
              $block = [scriptblock]::Create($using:flushText)
              & $block (Join-Path $using:dir "w$_") 250
            }
            $sw.Stop()
            Summarize "$name 4 writers wall=$([math]::Round($sw.Elapsed.TotalSeconds, 1))s" $all
          }

